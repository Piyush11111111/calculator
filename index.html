<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./src/output.css">
</head>
<body class="min-h-screen bg-slate-500 flex items-center justify-center p-4">
    <div class="w-full max-w-sm rounded-2xl bg-slate-200 p-6 shadow-x1">
        <h1 class="text-2xl font-bold text-orange-300 text-center mb-5">Calculator</h1>

        <input type="text" id="display" value="0" readonly class="w-full rounded-lg bg-amber-200 p-4 text-right text-3xl text-blue-600 mb-4">

        <div class="grid grid-cols-4 gap-3">
           
<button data-key="AC" class="bg-rose-500 hover:bg-rose-600 text-black rounded-xl p-4 font-bold cursor-pointer shadow-md hover:shadow-rose-500/40 hover:-translate-y-1 active:scale-95 transition-all duration-200">AC</button>

            <button data-key="DEL"class="bg-red-500 hover:bg-red-600  text-black rounded-xl p-4 font-bold">DEL</button>
            <button data-key="/" class="bg-orange-500 hover:bg-orange-600 text-purple-500 rounded-xl p-4 font-bold">/</button>
            <button data-key="*" class="bg-orange-500 hover:bg-orange-600 text-purple-500 rounded-xl p-4 font-bold">*</button>

            <button data-key="7" class="bg-slate-700 hover:bg-slate-600 text-pink-500 rounded-xl p-4 font-bold">7</button>
            <button data-key="8" class="bg-slate-700 hover:bg-slate-600 text-pink-600 rounded-xl p-4 font-bold">8</button>
            <button data-key="9" class="bg-slate-700 hover:bg-slate-600 text-purple-700 rounded-xl p-4 font-bold">9</button>
            <button data-key="-" class="bg-orange-500 hover:bg-orange-600 text-purple-700 rounded-xl p-4 font-bold">-</button>

            <button data-key="4" class="bg-slate-700 hover:bg-slate-600 text-purple-700 rounded-xl p-4 font-bold">4</button>
            <button data-key="5" class="bg-slate-700 hover:bg-slate-600 text-purple-700 rounded-xl p-4 font-bold">5</button>
            <button data-key="6" class="bg-slate-700 hover:bg-slate-600 text-purple-700 rounded-xl p-4 font-bold">6</button>
            <button data-key="+" class="bg-orange-500 hover:bg-orange-600 text-red-500 rounded-xl p-4 font-bold">+</button>

            <button data-key="1" class="bg-slate-700 hover:bg-slate-600 text-purple-600 rounded-xl p-4 font-bold">1</button>
            <button data-key="2" class="bg-slate-700 hover:bg-slate-600 text-purple-600 rounded-xl p-4 font-bold">2</button>
            <button data-key="3" class="bg-slate-700 hover:bg-slate-600 text-purple-600 rounded-xl p-4 font-bold">3</button>
            <button data-key="=" class="bg-green-500 hover:bg-green-600 text-black rounded-xl p-4 font-bold">=</button>

            <button data-key="0" class="bg-slate-700 hover:bg-slate-600 text-purple-500 rounded-xl p-4 font-bold">0</button>
            <button data-key="." class="bg-orange-500 hover:bg-orange-600 text-red-500 rounded-xl p-4 font-bold">.</button>
        </div>
    </div>
   
    <script src="script.js"></script>
</body>
</html>
